[package]
name = "pingmybell"
description = "Free, open-source voice notifications and command center for AI coding agents — coming soon"
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lib]
name = "pingmybell"
path = "src/lib.rs"

[[bin]]
name = "pingmybell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
subtle = "2"
dirs = "5"
log = "0.4"
env_logger = "0.11"
tts = "0.26"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
pingmybell-installers = { path = "../installers" }
tauri-plugin-global-shortcut = "2.3.2"
# Native folder picker for the deps review's scan roots (PMB-17). First-party
# Tauri plugin, and the picker is driven from RUST so the Svelte side stays a
# renderer — no `@tauri-apps/plugin-dialog` in the frontend, and no JS
# dependency added for it.
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
# For killing a sweep's child by PROCESS GROUP (depsreview.rs). Killing the
# direct child alone leaves any descendant holding the pipes open, which
# parks the reader threads on `read_to_end` forever — a leak of two threads
# per abandoned check, every week, in a launch-at-login process. There is no
# std API for `killpg`. libc is already in the tree (the shim uses it).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# `Win32_Media_Audio` is for PlaySound (§11.3 chimes): SND_MEMORY plays a WAV
# straight out of a buffer, which is why the chimes ship as WAV.
# `Win32_System_Threading` is OpenProcess/GetProcessTimes (§11.3 quieting):
# a recorded pid is only trusted while its process predates the record.
# `Win32_System_JobObjects` (+ `Win32_Security`, which its signatures name) is
# the Job Object the deps review kills a timed-out manager's whole tree with.
# `Win32_System_Console` is AttachConsole, so the CLI subcommands can print
# from a windows-subsystem build.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }


[dev-dependencies]
tempfile = "3"
