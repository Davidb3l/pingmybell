[package]
name = "pingmybell"
description = "Free, open-source voice notifications and command center for AI coding agents — coming soon"
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true

[lib]
name = "pingmybell"
path = "src/lib.rs"

[[bin]]
name = "pingmybell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
subtle = "2"
dirs = "5"
log = "0.4"
env_logger = "0.11"
tts = "0.26"
pingmybell-installers = { path = "../installers" }

[dev-dependencies]
tempfile = "3"
