name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting needs no build, so it fails fast and on the cheapest runner.
  # Like clippy below it tracks `stable`: a rustfmt release that reformats
  # untouched code is fixed by running `cargo fmt --all`, not by pinning.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run sidecar
      - run: bunx svelte-check --tsconfig ./tsconfig.json
      - run: cargo test --workspace
      # Lints as errors. Added with PMB-16, which fixed the four lints that
      # had accumulated precisely because this step did not exist — one of
      # them in code that had just shipped. Clippy compiles crate by crate
      # and stops at the first failure, so a single unfixed lint hides every
      # later one; keeping this green keeps that from happening again.
      #
      # Deliberately on the `stable` toolchain above, NOT pinned. The
      # tradeoff is real and it bit on this step's very first run: CI was on
      # clippy 1.99 while the author was on 1.97, and 1.99's new
      # `chunks_exact_to_as_chunks` failed the build on untouched code.
      # Pinning would have hidden that, and every later lint, until someone
      # remembered to bump. The answer is to track stable and fix what it
      # finds — keep a local toolchain current (`rustup update stable`) so
      # this does not first surface in CI.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Windows gate: builds, tests and lints, mirroring the macOS job. (It was
  # `cargo check` only while the Windows runtime was deferred; the suite now
  # passes on Windows 11.) The bun steps are prerequisites of the Rust build,
  # not of the tests alone: tauri-build embeds `dist/` (the frontend build) and
  # requires the staged `pingmybell-shim` sidecar (`bun run sidecar`) to
  # exist, so even a compile fails without them. svelte-check stays macOS-only
  # (platform-independent).
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run sidecar
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  dco:
    # Every PR commit must carry a DCO sign-off (CONTRIBUTING.md). Mirrors the
    # Ametrite check; PR-only, since main only receives merged PRs.
    name: DCO sign-off check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer."
              echo "  Subject: $(git log -1 --format=%s "$sha")"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) without DCO sign-off. Run 'git commit --amend -s' (or rebase with --signoff) and force-push."
            exit 1
          fi
          echo "All commits carry a Signed-off-by trailer."
